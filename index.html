<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#272727">
<meta name="color-scheme" content="light">
<title>Quotation Maker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f3f3; --ink:#262626; --muted:#6b6b6b; --field:#f2f2f2; --line:#e3e3e3;
  --dark:#272727; --accent:#e8a33d; --ok:#5aa876; --err:#c0392b; --card:#ffffff;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}

/* ---------- top bar ---------- */
.bar{background:var(--dark);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.bar-in{max-width:760px;margin:0 auto;height:58px;display:flex;align-items:center;gap:6px;padding:0 10px 0 6px}
.bar h1{font-size:20px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:#fff}
.bar .ibtn:active{background:#ffffff22}
.bar .pad{width:12px}
.shell{max-width:760px;margin:0 auto;padding:0 0 40px}
.page-white{background:#fff;min-height:calc(100vh - 58px)}
.banner{background:#fff3cd;color:#5c4400;font-size:13px;padding:8px 14px;text-align:center}

/* ---------- common ---------- */
.pad-x{padding:0 18px}
h2.title{font-size:25px;font-weight:700;margin:22px 0 4px}
p.sub{color:var(--muted);margin:0 0 18px}
.fld{display:block;background:var(--field);border-radius:var(--radius);padding:9px 18px 8px;margin:0 0 14px;position:relative}
.fld>span{display:block;font-size:12.5px;color:var(--muted);letter-spacing:.2px}
.fld input,.fld select{display:block;width:100%;border:0;background:transparent;outline:none;font-size:17px;padding:3px 0 2px;min-height:28px}
.fld select{appearance:none;-webkit-appearance:none;padding-right:20px}
.fld:focus-within{outline:2px solid var(--dark);outline-offset:-2px}
.fld.err{outline:2px solid var(--err);outline-offset:-2px}
.fld.ico{display:flex;align-items:center;gap:16px}
.fld.ico svg{flex:none;color:var(--dark)}
.fld.ico .col{flex:1;min-width:0}
.btn{display:block;width:100%;background:var(--dark);color:#fff;border-radius:16px;padding:16px;font-size:17px;font-weight:600;letter-spacing:.4px;text-align:center}
.btn:active{opacity:.85}
.btn.ghost{background:#fff;color:var(--dark);border:1.5px solid #c9c9c9}
.btn:disabled{opacity:.5}
.btnrow{display:flex;gap:12px;padding:14px 18px calc(18px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:#fff}
.btnrow .btn{flex:1}
.err-msg{color:var(--err);font-size:13.5px;margin:-6px 4px 12px}

/* ---------- stepper ---------- */
.stepper{display:flex;align-items:center;padding:20px 24px 16px;border-bottom:1px solid var(--line)}
.stepper .line{flex:1;height:3px;background:#dcdcdc;margin:0 2px}
.stepper .line.on{background:var(--dark)}
.dot{width:38px;height:38px;border-radius:50%;border:2.5px solid #7a7f87;color:#5e636b;display:grid;place-items:center;font-weight:700;font-size:16px;background:#fff;flex:none}
.dot.cur,.dot.done{background:var(--dark);border-color:var(--dark);color:#fff}
.dot.done{cursor:pointer}

/* ---------- uploads ---------- */
.up{border:2px dashed #cfcfcf;border-radius:22px;padding:22px 14px;text-align:center;margin:10px 0 8px;cursor:pointer;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.up .circle{width:58px;height:58px;border-radius:50%;background:#f0f0f0;display:grid;place-items:center;margin-bottom:6px}
.up b{color:#17323c;font-size:17px}
.up small{color:var(--muted);font-size:14px}
.up img{max-width:100%;max-height:140px;object-fit:contain}
.uplinks{display:flex;gap:18px;justify-content:center;margin-top:8px}
.uplinks button{color:#17323c;font-weight:600;font-size:14px;text-decoration:underline}
.sec{font-size:19px;font-weight:700;margin:20px 0 2px}
.hr{height:1px;background:var(--line);margin:18px 0}

/* ---------- language / login ---------- */
.center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:460px;margin:0 auto;padding:24px 22px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.brand img{width:62px;height:62px;border-radius:16px}
.brand b{font-size:26px;font-weight:700;line-height:1.1}
.langcard{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid #e1e1e1;border-radius:20px;padding:20px 22px;margin-bottom:14px;width:100%;text-align:left}
.langcard .big{font-size:22px;font-weight:700}
.langcard .small{color:var(--muted);font-size:14px}
.langcard.sel{border-color:var(--dark);background:#fafafa}
.radio{width:26px;height:26px;border-radius:50%;border:2.5px solid #b8b8b8;display:grid;place-items:center}
.langcard.sel .radio{border-color:var(--dark);background:var(--dark);color:#fff}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:#fff;border:1.5px solid #c9c9c9;border-radius:16px;padding:15px;font-size:17px;font-weight:600;margin-top:22px}
.gbtn:active{background:#f6f6f6}
.link{color:#17323c;text-decoration:underline;font-weight:600;font-size:15px;display:inline-block;margin-top:18px}
.muted{color:var(--muted)}

/* ---------- home ---------- */
.home-top{padding:22px 18px 6px;display:flex;align-items:flex-start;gap:10px}
.home-top .hello{flex:1;min-width:0}
.home-top h1{font-size:31px;margin:0;font-weight:700}
.home-top p{margin:2px 0 0;font-size:19px;color:#444;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gear{width:52px;height:52px;border-radius:16px;background:#fff;box-shadow:0 1px 6px #0002;display:grid;place-items:center}
.manage{padding:14px 18px 6px}
.manage h3{font-size:24px;margin:8px 0 14px;font-weight:700}
.mrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;letter-spacing:.3px;font-weight:500;text-transform:uppercase;min-width:0}
.mbtn .sq{width:72px;height:72px;border-radius:22px;background:#fff;box-shadow:0 2px 8px #0001;display:grid;place-items:center;color:var(--dark)}
.panel{background:#ececec;border-radius:36px 36px 0 0;margin-top:22px;padding:22px 16px 40px;min-height:50vh}
.setup{display:flex;align-items:center;gap:10px;background:#fdf7e6;border-radius:22px;padding:18px 18px;margin-bottom:16px;width:100%;text-align:left}
.setup .tx{flex:1}
.setup b{font-size:19px;display:block;line-height:1.2}
.setup small{color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{background:#fff;border-radius:26px;padding:18px 18px 16px;text-align:left;min-height:170px;box-shadow:0 3px 10px #0001;display:flex;flex-direction:column;justify-content:space-between}
.tile .c{width:46px;height:46px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center}
.tile b{font-size:20px;display:block;line-height:1.15;margin-top:18px;font-weight:600}
.tile small{color:var(--muted);font-size:14.5px;display:block;margin-top:3px}
.tile:active{transform:scale(.98)}

/* ---------- lists (score / settings) ---------- */
.list{background:#fff}
.row{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row .tx{flex:1;min-width:0}
.row b{font-weight:600;font-size:18px;display:block}
.row small{color:var(--muted);font-size:15px;display:block}
.row.done b,.row.done small{text-decoration:line-through;color:#9a9a9a}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid #cfcfcf;flex:none;display:grid;place-items:center}
.row.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.gh{background:#f3f3f3;margin:14px 12px 4px;border-radius:18px;padding:14px 16px;font-weight:700;font-size:18px}
.srow{padding:17px 24px;font-size:18px;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.profilecard{display:flex;align-items:center;gap:14px;padding:18px}
.profilecard img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#ddd}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;flex:none}
.profilecard b{display:block;font-size:19px}
.profilecard small{color:var(--muted);font-size:15px}

/* ---------- lists, forms, tabs, sheet (step 2) ---------- */
.searchbox{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;box-shadow:0 1px 8px #0002;margin:14px 16px;padding:0 16px;color:#555}
.searchbox input{flex:1;border:0;outline:none;background:transparent;font-size:17px;padding:15px 0;min-width:0}
.items{padding:0 16px 110px}
.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:10px;width:100%;text-align:left;box-shadow:0 1px 5px #0001}
.item .tx{flex:1;min-width:0}
.item b{display:block;font-size:18px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{display:block;color:var(--muted);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .rt{font-weight:600;white-space:nowrap}
.empty{text-align:center;color:#444;padding:90px 20px;font-size:17px}
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));right:max(16px,calc(50% - 364px));background:#c4325f;color:#fff;border-radius:50%;width:92px;height:92px;font-size:12.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;display:grid;place-items:center;text-align:center;line-height:1.15;padding:10px;box-shadow:0 5px 14px #0004;z-index:15}
.fab:active{transform:scale(.96)}
.btn.danger{background:#fff;color:var(--err);border:1.5px solid #e2b3ad}
.fld textarea{display:block;width:100%;border:0;background:transparent;outline:none;font-size:17px;padding:4px 0;min-height:96px;resize:vertical}
.cnt{text-align:right;color:var(--muted);font-size:13px;margin:-8px 8px 12px}
.fld .pick{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:42px;height:42px;display:grid;place-items:center;color:#555;border-radius:12px}
.fld .pick:active{background:#e6e6e6}
.fld.hasbtn input{padding-right:46px}
.sechead{background:#f3f3f3;margin:8px -18px 16px;padding:14px 18px;font-weight:700;font-size:18px}
.tabs{display:flex;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;top:58px;z-index:10}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:15px 20px;font-size:16.5px;font-weight:600;color:#777;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:#2c6b82;border-bottom-color:#2c6b82}
.term{background:#fff;border-radius:16px;padding:14px 14px 10px 16px;margin-bottom:10px;box-shadow:0 1px 5px #0001;display:flex;gap:10px;align-items:flex-start}
.term p{flex:1;margin:0;white-space:pre-wrap;word-break:break-word;font-size:16.5px}
.term .acts{display:flex;flex-direction:column;gap:2px}
.term .acts button{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#555}
.term .acts button:active{background:#eee}
.ov{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:12px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet .grab{width:56px;height:5px;border-radius:3px;background:#ccc;margin:0 auto 14px}
.sheet h3{font-size:22px;margin:6px 0 14px}
.plus-sq{width:44px;height:44px;border-radius:12px;background:#fff;color:var(--dark);display:grid;place-items:center;margin-right:2px}

/* ---------- quotation (step 3) ---------- */
.qtop{background:#f3f3f3;padding:14px 16px 12px;border-radius:0 0 18px 18px}
.qrow{display:flex;justify-content:space-between;gap:12px}
.qrow small{display:block;color:#444;font-size:14px}
.qrow b{font-size:19px;font-weight:600}
.qdate{position:relative;display:block}
.qdate input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.qno{border:0;border-bottom:1px dashed #aaa;background:transparent;font:inherit;font-size:19px;font-weight:600;text-align:right;width:150px;outline:none;padding:0 0 1px}
.swatches{display:flex;gap:12px;flex-wrap:wrap;padding:4px 0 10px}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #bbb}
.swatch.on{box-shadow:0 0 0 3px var(--dark)}
.stylerow{display:flex;gap:10px;padding-bottom:12px}
.stylerow button{flex:1;padding:12px 4px;border-radius:14px;background:var(--field);font-size:16px;font-weight:600;border:2px solid transparent}
.stylerow button.on{border-color:var(--dark);background:#fff}
.tpl{padding:4px 16px 120px}
.tpl h3{font-size:18px;margin:20px 4px 8px}
.tpl .hint{color:var(--muted);font-size:14px;margin:-2px 4px 10px}
.tplbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;background:#fff;box-shadow:0 -2px 10px #0002;z-index:20}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:10px;margin-left:8px;vertical-align:middle}
.chip.paid{background:#dff3e4;color:#1d7a3a}.chip.partial{background:#fff0d6;color:#9a6200}.chip.unpaid{background:#fde2e2;color:#b42318}
.qpay{background:#fff;border-radius:18px;margin:10px 14px 0;padding:6px 16px 4px;box-shadow:0 1px 6px #0002}
.qother{width:100%;border:0;background:transparent;outline:none;font-size:16px;padding:10px 0 2px;border-top:1px solid #e4e4e4;margin-top:10px}
.qsec{display:flex;align-items:center;justify-content:space-between;background:#f3f3f3;border-radius:18px;padding:12px 12px 12px 20px;margin:14px 14px 0;font-weight:700;font-size:18px;text-transform:uppercase;width:calc(100% - 28px);text-align:left}
.qsec .add{width:58px;height:46px;border-radius:14px;background:var(--dark);color:#fff;display:grid;place-items:center;flex:none}
.qcard{background:#fff;border-radius:18px;margin:10px 14px 0;padding:14px 8px 14px 18px;box-shadow:0 1px 6px #0002;display:flex;gap:6px;align-items:center;text-align:left;width:calc(100% - 28px)}
.qcard .tx{flex:1;min-width:0}
.qcard b{display:block;font-size:19px;font-weight:600}
.qcard small{display:block;color:var(--muted);font-size:15px}
.qcard .sp{display:flex;justify-content:space-between;gap:10px}
.qcard .ibt{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#222;flex:none}
.qcard .ibt:active{background:#eee}
.qgst{background:#fff;border-radius:18px;margin:10px 14px 0;padding:6px 16px 4px;box-shadow:0 1px 6px #0002}
.qgst .r,.qpay .r{display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-size:17px;border-bottom:1px solid #eee}
.qgst .r:last-child,.qpay .r:last-child{border-bottom:0}
.qgst select,.qpay select{border:0;background:#f2f2f2;border-radius:12px;padding:10px 12px;font-size:16px;max-width:60%}
.sw{position:relative;width:54px;height:30px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;border-radius:15px;background:#c8c8c8;transition:.2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0004}
.sw input:checked+i{background:var(--dark)}
.sw input:checked+i::after{left:27px}
.qbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(620px,calc(100% - 24px));background:var(--dark);color:#fff;border-radius:36px;display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 24px;z-index:20;box-shadow:0 6px 18px #0004}
.qbar small{display:block;font-size:14px;color:#ddd}
.qbar b{font-size:27px;font-weight:700}
.qbar .gen{background:#fff;color:var(--dark);border-radius:28px;padding:16px 40px;font-weight:600;font-size:18px;letter-spacing:1px}
.qbar .gen:disabled{opacity:.6}
.chk-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;font-size:17px}
.chk-row input[type=checkbox]{width:26px;height:26px;accent-color:var(--dark)}
.tpick{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid #eee;font-size:16px;width:100%;text-align:left}
.tpick input{width:24px;height:24px;margin-top:2px;accent-color:var(--dark);flex:none}
.sheet.tall{height:88vh;display:flex;flex-direction:column}
.sheet.tall .scroll{flex:1;overflow:auto;margin:0 -6px;padding:0 6px}
.sheet .searchbox{margin:0 0 10px}
.paperwrap{padding:12px 8px 110px;overflow:hidden}
.paper{width:794px;background:#fff;transform-origin:top left;box-shadow:0 2px 12px #0003}
.actbar{position:fixed;left:0;right:0;bottom:0;background:#f7f7f7;border-top:1px solid #e1e1e1;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.actbar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.actbar button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;font-size:15px;font-weight:500;color:#222}
.actbar button:active{background:#eee}
.wa-btn{background:#25d366;color:#fff!important;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;margin-right:4px}
.mrow2{display:flex;align-items:center;gap:14px;padding:16px 6px;font-size:18px;width:100%;text-align:left;border-bottom:1px solid #eee}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(30px);background:#111;color:#fff;padding:12px 20px;border-radius:14px;opacity:0;transition:.25s;z-index:99;max-width:90vw;text-align:center;font-size:15px;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{display:grid;place-items:center;min-height:100vh;color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid #ddd;border-top-color:var(--dark);animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div><div class="spin"></div>Loading…</div></div></div>
<div id="toast"></div>

<script src="firebase-config.js"></script>
<script>
"use strict";
/* =====================================================================
   QUOTATION MAKER  –  Step 1
   Google sign-in, language, business setup, home, profile score, settings
   ===================================================================== */

/* ---------------- safe storage (works even if browser blocks it) ---------------- */
const mem = {};
const LS = {
  get(k){ try{ const v = localStorage.getItem(k); return v===null ? (k in mem ? mem[k] : null) : v; }catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){} }
};

/* ---------------- translations ---------------- */
const T = {
  en:{
    appName:"Quotation Maker", chooseLang:"Choose your language", langHint:"You can change this later in Settings.",
    cont:"Continue", tagline:"Make quotations and save your customers — on mobile and laptop.",
    signInGoogle:"Sign in with Google", signInFail:"Sign-in failed. Please try again.", popupClosed:"Sign-in window was closed.",
    demoBanner:"DEMO mode – data is saved only in this browser.",
    bizInfo:"Business Information", s1Title:"Tell us about your business", s1Sub:"Fill in your basic business details to get started",
    bizName:"Business Name", contactName:"Contact Name", email:"Email", phone:"Phone Number", addr1:"Address Line 1", addr2:"Address Line 2",
    s2Title:"Add your business identity", s2Sub:"Upload your logo and signature to personalize your documents",

   ===================================================================== */
const CFG = window.QM_FIREBASE || {};
const DEMO = !CFG.apiKey || String(CFG.apiKey).startsWith('PASTE');
let backend;

async function makeBackend(){
  if (DEMO){
    const listeners=[];
    const read = ()=>{ try{ return JSON.parse(LS.get('qm_demo_owner')||'null'); }catch(e){ return null; } };
    const cols = ()=>{ try{ return JSON.parse(LS.get('qm_demo_cols')||'{}'); }catch(e){ return {}; } };
    backend = {
      demo:true,
      onAuth(cb){ listeners.push(cb); const u = LS.get('qm_demo_user'); setTimeout(()=>cb(u?JSON.parse(u):null),50); },
      async signIn(){ const u={uid:'demo',displayName:'Demo User',email:'demo.user@example.com',photoURL:''}; LS.set('qm_demo_user',JSON.stringify(u)); listeners.forEach(f=>f(u)); },
      async signOut(){ LS.del('qm_demo_user'); listeners.forEach(f=>f(null)); },
      async load(){ return read(); },
      async save(user, patch){ const cur=read()||{}; LS.set('qm_demo_owner', JSON.stringify(deepMerge(cur, patch))); },
      async list(user, col){ return Object.values(cols()[col]||{}); },
      async put(user, col, id, data){ const c=cols(); (c[col]=c[col]||{})[id]=data; LS.set('qm_demo_cols', JSON.stringify(c)); },
      async remove(user, col, id){ const c=cols(); if (c[col]) delete c[col][id]; LS.set('qm_demo_cols', JSON.stringify(c)); }
    };
    return;
  }
  const V='10.12.2', base=`https://www.gstatic.com/firebasejs/${V}/`;
  const [A, Au, Fs] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
  const app = A.initializeApp(CFG);
  const auth = Au.getAuth(app);
  let db;
  try{ db = Fs.initializeFirestore(app,{ localCache: Fs.persistentLocalCache({ tabManager: Fs.persistentMultipleTabManager() }) }); }
  catch(e){ db = Fs.getFirestore(app); }
  const provider = new Au.GoogleAuthProvider();
  provider.setCustomParameters({prompt:'select_account'});
  backend = {
    demo:false,
    onAuth(cb){ Au.onAuthStateChanged(auth, u => cb(u ? {uid:u.uid,displayName:u.displayName||'',email:u.email||'',photoURL:u.photoURL||''} : null)); },
    async signIn(){
      try{ await Au.signInWithPopup(auth, provider); }
      catch(e){
        if (e && (e.code==='auth/popup-blocked' || e.code==='auth/operation-not-supported-in-this-environment')) { await Au.signInWithRedirect(auth, provider); return; }
        throw e;
      }
    },
    async signOut(){ await Au.signOut(auth); },
    async load(user){ const s = await Fs.getDoc(Fs.doc(db,'owners',user.uid)); return s.exists() ? s.data() : null; },
    async save(user, patch){ await Fs.setDoc(Fs.doc(db,'owners',user.uid), patch, {merge:true}); },
    async list(user, col){ const s = await Fs.getDocs(Fs.collection(db,'owners',user.uid,col)); return s.docs.map(d=>Object.assign({id:d.id}, d.data())); },
    async put(user, col, id, data){ await Fs.setDoc(Fs.doc(db,'owners',user.uid,col,id), data); },
    async remove(user, col, id){ await Fs.deleteDoc(Fs.doc(db,'owners',user.uid,col,id)); }
  };
}
function deepMerge(a,b){
  const o = Array.isArray(a)? a.slice() : Object.assign({}, a);
  for (const k in b){
    if (b[k] && typeof b[k]==='object' && !Array.isArray(b[k])) o[k] = deepMerge(o[k]&&typeof o[k]==='object'?o[k]:{}, b[k]);
    else o[k] = b[k];
  }
  return o;
}

const app = $('#app');
function go(hash){ if (location.hash === '#'+hash) route(); else location.hash = hash; }
function currentRoute(){ return (location.hash||'').replace(/^#\/?/,'') || 'home'; }

function route(){
  if (!S.ready){ return; }
  window.scrollTo(0,0);
  if (!LANG) return viewLang(true);
  if (!S.user) return viewLogin();
  const r = currentRoute();
  const setupDone = !!(biz().setupDone);
  if (!setupDone){ if (!WZ || !WZ.setup) startWizard({setup:true}); return viewWizard(); }
  if (r.startsWith('wizard')){ if(!WZ) startWizard({}); return viewWizard(); }
  const seg0 = r.split('/')[0], act0 = r.split('/')[1];
  if (SEG_KIND[r] && DK[SEG_KIND[r]].list===r) return viewQuotations(SEG_KIND[r]);
  if (SEG_KIND[seg0] && DK[SEG_KIND[seg0]].route===seg0){
    if (act0==='new') return viewQForm('new');
    if (act0==='edit'||act0==='dup'||act0==='from') return viewQForm(act0, r.split('/')[2]);
    if (act0==='view') return viewQView(r.split('/')[2]);
  }
  if (r==='customers') return viewList('customers');
  if (r==='products') return viewList('products');
  if (r.startsWith('customer/')) return viewForm('customer', r.split('/')[1]);
  if (r.startsWith('product/')) return viewForm('product', r.split('/')[1]);
  if (r==='terms') return viewTerms();
  if (r==='template') return viewTemplate();
  if (r==='score') return viewScore();
  if (r==='settings') return viewSettings();
  if (r==='language') return viewLang(false);
  return viewHome();
}

function resizeImage(file, maxW, maxH, fmt){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = ()=>rej(new Error('read'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>rej(new Error('img'));
      img.onload = ()=>{
        const r = Math.min(1, maxW/img.width, maxH/img.height);
        const c = document.createElement('canvas');
        c.width = Math.max(1,Math.round(img.width*r)); c.height = Math.max(1,Math.round(img.height*r));
        const cx = c.getContext('2d'); if (fmt==='jpeg'){ cx.fillStyle='#fff'; cx.fillRect(0,0,c.width,c.height); }
        cx.drawImage(img,0,0,c.width,c.height);
        if (fmt==='jpeg'){ res(c.toDataURL('image/jpeg', .8)); return; }
        let out = c.toDataURL('image/png');
        if (out.length > 600000) out = c.toDataURL('image/jpeg', .85);
        res(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const r2 = n => Math.round((+n + Number.EPSILON) * 100) / 100;
const nf = n => String(+(+n || 0).toFixed(3));
const isoToday = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
function fmtIso(iso, f){ const p = String(iso||'').split('-').map(Number); if (p.length<3 || !p[0]) return ''; return fmtDate(new Date(p[0], p[1]-1, p[2]), f||'dd/MM/yyyy'); }

/* the one place where every amount is worked out */
function calcQ(q){
  const mode = q.gstMode, tt = q.taxType, useTax = tt !== 'none';
  const lines = [], ch = [], groups = {};
  let sub = 0, chargeSum = 0;
  (q.items||[]).forEach(it=>{
    const qty = +it.qty||0, rate = +it.rate||0, disc = +it.disc||0, g = useTax ? (+it.gst||0) : 0;
    const gross = r2(qty*rate), dAmt = r2(gross*disc/100), net = r2(gross-dAmt);
    let base = net, tax = 0;
    if (g > 0){
      if (mode==='incl'){ base = r2(net/(1+g/100)); tax = r2(net-base); }
      else { tax = r2(net*g/100); }
    }
    lines.push({gross, dAmt, net, base, tax, g, show: mode==='incl' ? net : base});
    sub = r2(sub+base);
    if (tax) groups[g] = r2((groups[g]||0)+tax);
  });
  (q.charges||[]).forEach(c=>{
    const amt = r2(+c.amount||0), g = (useTax && c.taxable) ? (+c.gst||0) : 0;
    let base = amt, tax = 0;
    if (g > 0){
      if (mode==='incl'){ base = r2(amt/(1+g/100)); tax = r2(amt-base); }
      else { tax = r2(amt*g/100); }
    }
    ch.push({label:c.label, base, tax, g});
    chargeSum = r2(chargeSum+base);
    if (tax) groups[g] = r2((groups[g]||0)+tax);
  });
  const taxLines = [];
  Object.keys(groups).map(Number).sort((a,b)=>a-b).forEach(g=>{
    const tx = groups[g];
    if (tt==='igst') taxLines.push({label:'IGST', rate:g, amount:tx});
    else { const h = r2(tx/2); taxLines.push({label:'CGST', rate:g/2, amount:h}); taxLines.push({label:'SGST', rate:g/2, amount:r2(tx-h)}); }
  });
  const taxTotal = taxLines.reduce((s,x)=>r2(s+x.amount), 0);
  return { lines, ch, sub, taxLines, taxTotal, total: r2(sub + chargeSum + taxTotal) };
}

/* ---------- Make / edit quotation ---------- */
function initQD0(mode, id, key){
  const kind = kindOfRoute(key), K = DK[kind];
  const list = S.cache[K.col] || [];
  let base = null;
  if (mode==='from'){ base = findDoc(id); if (!base){ QD = null; goReplace('quotations'); return false; } }
  else if (mode !== 'new'){ base = list.find(x=>x.id===id); if (!base){ QD = null; goReplace(K.list); return false; } }
  const cnt = S.owner.counters && S.owner.counters[K.cnt];
  const maxSeq = (cnt!=null && cnt!=='') ? (+cnt||0) : Math.max(0, ...list.map(x=>x.seq||0));
  const savedTerms = (S.cache.terms||[]).filter(x=>x.type===K.term).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).map(x=>x.text);
  const mkNo = seq => ((S.owner.template && S.owner.template[K.pre]!=null) ? S.owner.template[K.pre] : K.def) + seq;
  if (kind==='receipt'){
    if (mode==='edit'){ QD = JSON.parse(JSON.stringify(base)); QD.isNew = false; QD.kind = kind; QD.oldAmount = +base.amount||0; QD.oldInvoiceId = base.invoiceId||''; }
    else {
      QD = { id: uid(), kind, isNew: true, seq: maxSeq+1, date: isoToday(), no: mkNo(maxSeq+1), customer:null, amount:'', mode:'cash', ref:'', invoiceId:'', invoiceNo:'', other:'', terms: savedTerms };
      if (mode==='dup'){ const c = JSON.parse(JSON.stringify(base)); Object.assign(QD, { customer:c.customer, amount:c.amount, mode:c.mode, ref:'', other:c.other||'', terms:c.terms||[] }); }
      if (mode==='from' && base.kind==='invoice'){
        const bal = Math.max(0, r2(calcQ(base).total - paidOf(base, calcQ(base).total)));
        QD.customer = base.customer; QD.invoiceId = base.id; QD.invoiceNo = base.no; QD.amount = bal>0 ? String(bal) : '';
      }
    }
    QD.key = key; return true;
  }
  if (mode==='edit'){
    QD = JSON.parse(JSON.stringify(base)); QD.isNew = false; QD.taxTypeManual = true; QD.kind = kind;
  } else {
    QD = { id: uid(), kind, isNew: true, seq: maxSeq+1, date: isoToday(), other:'', customer:null, items:[], charges:[], terms: savedTerms,
           gstMode: (S.owner.prefs && S.owner.prefs.gstMode) || 'excl', taxType:'cgst_sgst', taxTypeManual:false };
    QD.no = mkNo(QD.seq);
    if (kind==='invoice'){ QD.due = addDays(QD.date, 7); QD.payStatus = 'unpaid'; QD.paid = ''; }
    if (mode==='dup' || mode==='from'){
      const c = JSON.parse(JSON.stringify(base));
      Object.assign(QD, { other:c.other||'', customer:c.customer, items:c.items, charges:c.charges, gstMode:c.gstMode, taxType:c.taxType, taxTypeManual:true });
      if (mode==='dup') QD.terms = c.terms||[];
      if (mode==='from'){ QD.refNo = base.no; QD.refId = base.id; }
    }
  }
  QD.key = key;
  return true;
}
function initQD(mode, id, key){
  if (!initQD0(mode, id, key)) return false;
  applyAutoNo();
  return true;
}
function nextNo(kind, cust){
  const K = DK[kind], list = S.cache[K.col] || [];
  const same = cust ? list.filter(x=>x.customer && (x.customer.id && cust.id ? x.customer.id===cust.id : (x.customer.name||'')===(cust.name||''))) : [];
  const start = Math.max(1, parseInt(S.owner.starts && S.owner.starts[kind], 10) || 1);
  const seq = same.length ? Math.max(...same.map(x=>+x.seq||0)) + 1 : start;
  const pre = (S.owner.template && S.owner.template[K.pre]!=null) ? S.owner.template[K.pre] : K.def;
  const nm = cust ? String(cust.company||cust.name||'').trim() : '';
  return { seq, no: (nm ? nm+'-' : '') + pre + seq };
}
function applyAutoNo(){
  if (!QD || !QD.isNew || QD.noManual) return;
  const r = nextNo(QD.kind||'quotation', QD.customer);
  QD.seq = r.seq; QD.no = r.no;
}
function autoTax(){
  if (!QD || QD.taxTypeManual || !QD.customer) return;
  const a = norm(biz().state), c = norm(QD.customer.state);
  QD.taxType = (a && c && a !== c) ? 'igst' : 'cgst_sgst';
}
function setQCustomer(r){
  QD.customer = { id:r.id, name:r.name, company:r.company||'', email:r.email||'', mobile:r.mobile||'', addr1:r.addr1||'', addr2:r.addr2||'', gstin:r.gstin||'', state:r.state||'' };
  autoTax();
  applyAutoNo();
}

function unpaidInvoices(){
  return (S.cache.invoices||[]).map(inv=>{ const tot = calcQ(inv).total; return { inv, bal: Math.max(0, r2(tot - paidOf(inv, tot))) }; })
    .filter(x=>x.bal>0 && (!QD.customer || !x.inv.customer || x.inv.customer.id===QD.customer.id || x.inv.id===QD.invoiceId))
    .sort((a,b)=>(b.inv.seq||0)-(a.inv.seq||0));
}

async function adjustInvoicePaid(invId, delta){
  if (!invId || !delta) return;
  await ensure('invoices');
  const inv = (S.cache.invoices||[]).find(x=>x.id===invId); if (!inv) return;
  const total = calcQ(inv).total, now = paidOf(inv, total);
  const np = Math.min(total, Math.max(0, r2(now + delta)));
  const status = np >= total - 0.005 ? 'paid' : (np > 0 ? 'partial' : 'unpaid');
  const rec = Object.assign({}, inv, { payStatus:status, paid: status==='partial' ? np : 0, updatedAt: Date.now() });
  await backend.put(S.user, 'invoices', rec.id, rec);
  const i = S.cache.invoices.findIndex(x=>x.id===rec.id); if (i>=0) S.cache.invoices[i] = rec;
}
async function generateReceipt(btn){
  const K = DK.receipt, amt = parseFloat(String(QD.amount).replace(/,/g,''));
  if (!QD.customer){ toast(t('needCustomer')); return; }
  if (!(amt>0)){ toast(t('needAmount')); return; }
  QD.no = String(QD.no||'').trim();
  if (!QD.no){ toast(t('needNo')); return; }
  if ((S.cache[K.col]||[]).some(x=>x.id!==QD.id && String(x.no).toLowerCase()===QD.no.toLowerCase())){ toast(t('numUsed')); return; }
  btn.disabled = true;
  const rec = { id:QD.id, kind:'receipt', no:QD.no, seq:QD.seq, date:QD.date||isoToday(), other:(QD.other||'').trim(), customer:QD.customer, amount:amt, mode:QD.mode||'cash', ref:(QD.ref||'').trim(),
    invoiceId:QD.invoiceId||'', invoiceNo:QD.invoiceNo||'', terms:QD.terms, total:amt, createdAt: QD.createdAt || Date.now(), updatedAt: Date.now() };
  try{
    if (!QD.isNew && QD.oldInvoiceId) await adjustInvoicePaid(QD.oldInvoiceId, -(QD.oldAmount||0));
    if (rec.invoiceId) await adjustInvoicePaid(rec.invoiceId, amt);
    await backend.put(S.user, K.col, rec.id, rec);
    const list = S.cache[K.col] || (S.cache[K.col]=[]);
    const k = list.findIndex(x=>x.id===rec.id);
    if (k>=0) list[k] = rec; else list.push(rec);
    await syncCounts(K.col);
    QD = null;
    toast(t('saved')); goReplace(K.route+'/view/'+rec.id);
  }catch(e){ console.error(e); toast(t('saveFail')); btn.disabled = false; }
}
function qAction(act, el){
  const i = +el.dataset.i;
  switch (act){
    case 'qcust': return openPicker('customers');
    case 'qprod': return openPicker('products');
    case 'qselcust': { const r=S.cache.customers.find(x=>x.id===el.dataset.id); if (r){ setQCustomer(r); if (QD.kind==='receipt' && QD.invoiceId){ const inv=(S.cache.invoices||[]).find(x=>x.id===QD.invoiceId); if (inv && inv.customer && inv.customer.id!==r.id){ QD.invoiceId=''; QD.invoiceNo=''; } } closeSheet(); renderQForm(); } return; }
    case 'qselprod': { const r=S.cache.products.find(x=>x.id===el.dataset.id); if (r){ addQItem(r); closeSheet(); renderQForm(); } return; }
    case 'qnewcust': RETURN = {hash:QD.key}; closeSheet(); return go('customer/new');
    case 'qnewprod': RETURN = {hash:QD.key}; closeSheet(); return go('product/new');
    case 'qcustdel': QD.customer = null; applyAutoNo(); return renderQForm();
    case 'rinv': return openInvoicePicker();
    case 'rinvdel': QD.invoiceId = ''; QD.invoiceNo = ''; return renderQForm();
    case 'rselinv': { const inv=(S.cache.invoices||[]).find(x=>x.id===el.dataset.id); if (inv){ const tot=calcQ(inv).total, bal=Math.max(0,r2(tot-paidOf(inv,tot))); QD.invoiceId=inv.id; QD.invoiceNo=inv.no; if (inv.customer && !QD.customer){ QD.customer=inv.customer; applyAutoNo(); } if (!(parseFloat(QD.amount)>0)) QD.amount=String(bal); closeSheet(); renderQForm(); } return; }
    case 'qitem': return openItemSheet(i);
    case 'qitemdel': QD.items.splice(i,1); return renderQForm();
    case 'qitemsave': {
      const it = QD.items[i], q = numVal('itQty'), full = !!$('#itRate');
      it.qty = q>=0 ? q : 1;
      if (full){ const r = numVal('itRate'), d = numVal('itDisc'), g = numVal('itGst'); it.rate = r>=0 ? r : 0; it.disc = d>=0&&d<=100 ? d : 0; it.gst = g>=0&&g<=100 ? g : 0; }
      it.unit = ($('#itUnit').value||'').trim().toUpperCase(); it.desc = ($('#itDesc').value||'').trim();
      closeSheet(); return renderQForm();
    }
    case 'qcharge': return openChargeSheet(-1);
    case 'qchargeedit': return openChargeSheet(i);
    case 'qchargedel': QD.charges.splice(i,1); return renderQForm();
    case 'qchargesave': {
      const label = ($('#chLabel').value||'').trim() || t('defCharge'), amt = numVal('chAmt'), taxable = $('#chTax').checked, g = numVal('chGst');
      if (!(amt>=0)){ $('#chAmtW').classList.add('err'); return; }
      const rec = { label, amount:amt, taxable, gst: taxable ? (g>=0&&g<=100?g:18) : 0 };
      if (i>=0) QD.charges[i] = rec; else QD.charges.push(rec);
      closeSheet(); return renderQForm();
    }
    case 'qterms': return openTermsPicker();
    case 'qtermsdone': {
      const picked = [...document.querySelectorAll('#sheet input[data-term]')].filter(x=>x.checked).map(x=>x.dataset.term);
      const custom = ($('#tpCustom').value||'').trim();
      const savedAll = new Set((S.cache.terms||[]).filter(x=>x.type===DK[QD.kind||'quotation'].term).map(x=>x.text));
      const manual = QD.terms.filter(x=>!savedAll.has(x));          // terms typed only for this quotation stay
      QD.terms = [...picked, ...manual]; if (custom) QD.terms.push(custom);
      closeSheet(); return renderQForm();
    }
    case 'qtermdel': QD.terms.splice(i,1); return renderQForm();
    case 'qgenerate': return QD.kind==='receipt' ? generateReceipt(el) : generateQuotation(el);
  }
}
async function generateQuotation(btn){
  const K = DK[QD.kind||'quotation'], isInv = QD.kind==='invoice';
  if (!QD.customer){ toast(t('needCustomer')); return; }
  if (!QD.items.length){ toast(t('needProduct')); return; }

  const c = calcQ(QD);

/* ---------- PDF ---------- */
function loadScript(urls){
  return new Promise((res, rej)=>{
    const tryNext = i => {
      if (i >= urls.length) return rej(new Error('script'));
      const s = document.createElement('script'); s.src = urls[i];
      s.onload = () => res(); s.onerror = () => { s.remove(); tryNext(i+1); };
      document.head.appendChild(s);
    };
    tryNext(0);
  });
}
async function pdfLibs(){
  if (!window.html2canvas) await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js']);
  if (!(window.jspdf && window.jspdf.jsPDF)) await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js']);
}
async function makePdf(q){
  await pdfLibs();
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-12000px;top:0;width:794px;background:#fff;z-index:-1';
  holder.innerHTML = docHtml(q);
  document.body.appendChild(holder);
  try{
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r=>setTimeout(r,150));
    const canvas = await window.html2canvas(holder.firstElementChild, { scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false });
    const pdf = new window.jspdf.jsPDF({ unit:'pt', format:'a4' });
    const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
    const pxPage = Math.floor(canvas.width * H / W);
    const pages = Math.max(1, Math.ceil((canvas.height - 6) / pxPage));
    for (let p=0; p<pages; p++){
      const c = document.createElement('canvas');
      c.width = canvas.width; c.height = Math.min(pxPage, canvas.height - p*pxPage);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(canvas, 0, p*pxPage, canvas.width, c.height, 0, 0, c.width, c.height);
      if (p>0) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, W, c.height * W / canvas.width);
      pdf.setFontSize(8); pdf.setTextColor(130);
      pdf.text('Page '+(p+1)+' of '+pages, W-36, H-16, {align:'right'});
    }
    return pdf.output('blob');
  } finally { holder.remove(); }
}
const pdfName = q => { const K = DK[DK[q.kind]?q.kind:'quotation'], n = String(q.no).replace(/[^\w-]+/g,'_'); return (new RegExp('^'+K.pdf.replace('-',''),'i').test(n) ? n : K.pdf+n) + '.pdf'; };
function downloadBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
async function sharePdf(q, downloadOnly){
  toast(t('making'));
  let blob;
  try{ blob = await makePdf(q); }catch(e){ console.error(e); toast(t('pdfFail')); return; }
  const name = pdfName(q), file = new File([blob], name, {type:'application/pdf'});
  if (!downloadOnly && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({ files:[file], title:name, text: t(DK[DK[q.kind]?q.kind:'quotation'].wa,{doc:t(DK[DK[q.kind]?q.kind:'quotation'].doc), no:q.no, firm:biz().name||'', amt:fmtMoney(q.total||0, biz().currency||'INR')}) }); return; }
    catch(e){ if (e && e.name==='AbortError') return; console.error(e); }
  }
  downloadBlob(blob, name);
}

function onTplInput(e){
  const k = e.target.dataset.tk; if (!k || !TP) return;
  const isCb = e.target.type==='checkbox', v = isCb ? e.target.checked : e.target.value;
  if (k.startsWith('h.')) TP.t.h[k.slice(2)] = v;
  else if (k.startsWith('pre.')) TP.nums[k.slice(4)].pre = v;
  else if (k.startsWith('next.')) TP.nums[k.slice(5)].next = v;
  else if (k==='dateFormat' || k==='currency') TP[k] = v;
  else TP.t[k] = (k==='lhTop'||k==='lhBottom') ? (String(v).trim()===''?'':Math.max(0,parseInt(v,10)||0)) : v;
  refreshTplPreview();

    case 'quotations': return go('quotations');
    case 'newi': return go('invoice/new');
    case 'pos': return go('pos');
    case 'proformas': return go('proformas');
    case 'dns': return go('dns');
    case 'receipts': return go('receipts');
    case 'invoices': return go('invoices');
    case 'qdup': case 'qedit': case 'qinv': case 'qpay': case 'qpaysave': case 'qshare': case 'qwa': case 'qmore': case 'qpdf': case 'qdelete': case 'qconv':
      return qViewAction(el.dataset.act, el);
    case 'logout': if (confirm(t('logoutAsk'))){ WZ=null; await backend.signOut(); } return;
    default: return qAction(el.dataset.act, el);
  }
});
document.addEventListener('input', e=>{
  const k = e.target.dataset && e.target.dataset.k;
  if (k && FM){ FM.d[k] = e.target.value; if (k==='description'){ const c=$('#cnt'); if (c) c.textContent = e.target.value.length+'/2000'; } }
  else if (k && WZ){ WZ.d[k] = e.target.value; }
  if (e.target.id==='q'){ const box=$('#items'); if (box) box.innerHTML = (e.target.dataset.col==='quotations'||e.target.dataset.col==='invoices') ? qItemsHtml(e.target.value, e.target.dataset.col==='invoices'?'invoice':'quotation') : itemsHtml(e.target.dataset.col, e.target.value); }
  if (e.target.id==='psearch'){ const box=$('#plist'); if (box) box.innerHTML = pickListHtml(e.target.dataset.kind, e.target.value); }
  if (e.target.dataset && e.target.dataset.qk) onQInput(e);
  if (e.target.dataset && e.target.dataset.tk && e.target.type!=='checkbox' && e.target.tagName!=='SELECT') onTplInput(e);
  if (e.target.id==='chTax'){ const w=$('#chGstW'); if (w) w.classList.toggle('hide', !e.target.checked); }
});
document.addEventListener('change', async e=>{
  if (e.target.id==='pyStatus'){ const w=$('#pyAmtW'); if (w) w.classList.toggle('hide', e.target.value!=='partial'); return; }
  if (e.target.dataset && e.target.dataset.tk && TP && (e.target.type==='checkbox' || e.target.tagName==='SELECT')){ onTplInput(e); if (e.target.dataset.tk==='useLh') renderTemplate(); return; }
  if (e.target.id==='lhpick' && e.target.files[0] && TP){
    try{ TP.lh = await resizeImage(e.target.files[0], 1000, 1414, 'jpeg'); TP.lhChanged = true; TP.t.useLh = true; renderTemplate(); }
    catch(err){ toast(t('badImage')); }
    return;
  }
  if (e.target.dataset && e.target.dataset.qk) onQInput(e);
  if (e.target.id==='chTax'){ const w=$('#chGstW'); if (w) w.classList.toggle('hide', !e.target.checked); }
  if (e.target.id==='filepick' && e.target.files[0] && WZ){
    try{
      const k = pickKey;
      WZ.d[k] = await resizeImage(e.target.files[0], k==='logo'?500:420, k==='logo'?500:200);
      viewWizard();
    }catch(err){ toast(t('badImage')); }
  } else if (e.target.dataset && e.target.dataset.k && WZ){
    WZ.d[e.target.dataset.k] = e.target.value;
  }
});
/* swipe left / right: between the 4 setup sections, and between the Terms tabs */
(function(){
  let x0=0,y0=0,on=false;
  const active = () => !!WZ || (currentRoute()==='terms' && !$('#sheet'));
  document.addEventListener('touchstart',e=>{ if(!active()||!e.touches[0]) return; if(e.target.closest('input,select,textarea,.btnrow,.tabs')) {on=false;return;} on=true; x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!on||!active()||!e.changedTouches[0]) return; on=false;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if (Math.abs(dx)<70 || Math.abs(dy)>50) return;
    if (WZ){
      if (dx<0 && WZ.step<4){ if (validateStep()) wzGo(WZ.step+1); }
      else if (dx>0 && WZ.step>1) wzGo(WZ.step-1);
    } else if (currentRoute()==='terms'){
      setTab(TAB + (dx<0 ? 1 : -1));
    }
  },{passive:true});
})();

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot(){
  if (LANG) document.documentElement.lang = LANG;
  try{ await makeBackend(); }
  catch(e){
    console.error(e);
    app.innerHTML = `<div class="center"><h2 class="title">Could not start</h2><p class="sub">Internet check karein aur page dobara kholein. / Please check your internet and reload.</p></div>`;
    return;
  }
  backend.onAuth(async user=>{
    S.user = user; S.cache = {}; FM = null;
    if (user){
      try{ S.owner = (await backend.load(user)) || {}; }catch(e){ console.error(e); S.owner = {}; }
      if (!LANG && S.owner.language) setLang(S.owner.language);
      else if (LANG && S.owner.language !== LANG){ try{ await backend.save(user,{language:LANG}); S.owner.language=LANG; }catch(e){} }
    } else { S.owner = {}; WZ = null; }
    S.ready = true;
    document.title = t('appName');
    route();
  });
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
